# cargo-deny policy. Run via `cargo xtask check`.
# Licences are an allow-list: anything not listed (including AGPL and GPL)
# fails the check. See docs/PRODUCT.md "Rules about Anki".

[graph]
all-features = true

[advisories]
# Fetches the free RustSec advisory database.
yanked = "deny"
ignore = [
  # proc-macro-error is unmaintained. Pulled in by gtk-rs 0.18, which Tauri
  # uses on Linux. No fix available to us. Accepted 2026-10-04.
  # REVISIT on every Tauri upgrade: remove this entry once Tauri no longer
  # depends on gtk-rs 0.18 (cargo deny will warn that the ignore is unused).
  { id = "RUSTSEC-2024-0370", reason = "transitive via tauri -> gtk 0.18, no upgrade available" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "CC0-1.0",
]
confidence-threshold = 0.9
# MPL-2.0 is weak (file-level) copyleft. Allowed only for these crates, all
# transitive via Tauri, so any new MPL dependency fails and gets reviewed.
exceptions = [
  { crate = "cssparser", allow = ["MPL-2.0"] },
  { crate = "cssparser-macros", allow = ["MPL-2.0"] },
  { crate = "dtoa-short", allow = ["MPL-2.0"] },
  { crate = "selectors", allow = ["MPL-2.0"] },
  { crate = "option-ext", allow = ["MPL-2.0"] },
]

[licenses.private]
# Our own crates are publish = false and have no licence until one is chosen.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
