[package]
name = "fc-api"
version = "0.0.0"
description = "Public, serialisable API of the core. One dispatcher for every host (Tauri, web, CLI)."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
fc-core = { path = "../fc-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "=12.0.1"

# Only the debug-only `debugSlow` uses it (it cannot sleep on wasm). Removed with the debug methods.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.106"
