[package]
name = "fc-core"
version = "0.0.0"
description = "Core library: domain logic shared by every app and the sync server."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# `bundled` compiles SQLite from C on native targets. On wasm32 rusqlite uses sqlite-wasm-rs.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rusqlite = "=0.40.2"

# FSRS scheduler and optimiser (ADR 0004). Pure Rust. Exact version, as for other key crates.
[dependencies]
fsrs = "=6.6.2"

# IDs (ADR 0006, section 1): UUIDv7 from host time and getrandom bytes. `v5` is for the
# deterministic IDs (card IDs from 1.3, requirement IDs here). `uuid` never reads the clock or the
# random number generator itself, we pass both in.
uuid = { version = "=1.27.0", default-features = false, features = ["v5"] }
getrandom = "=0.4.3"

# getrandom needs its browser backend on wasm (ADR 0003, ADR 0004; fsrs needs it too).
[target.'cfg(target_arch = "wasm32")'.dependencies.getrandom]
version = "=0.4.3"
features = ["wasm_js"]
