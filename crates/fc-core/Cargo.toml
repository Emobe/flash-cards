[package]
name = "fc-core"
version.workspace = true
description = "Core library: domain logic shared by every app and the sync server."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# `bundled` compiles SQLite from C on native targets. On wasm32 rusqlite uses sqlite-wasm-rs.
# `functions` (a feature of rusqlite itself, no new crate) lets search register the Unicode-aware
# text matching SQLite lacks (step 1.9).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled", "functions"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rusqlite = { version = "=0.40.2", features = ["functions"] }

# FSRS scheduler and optimiser (ADR 0004). Pure Rust. Exact version, as for other key crates.
[dependencies]
fsrs = "=6.6.2"

# IDs (ADR 0006, section 1): UUIDv7 from host time and getrandom bytes. `v5` is for the
# deterministic IDs (card IDs from 1.3, requirement IDs here). `uuid` never reads the clock or the
# random number generator itself, we pass both in.
uuid = { version = "=1.27.0", default-features = false, features = ["v5"] }
getrandom = "=0.4.3"

# SHA-256 identifies a media file (ADR 0006, section 8; step 1.10). Pure Rust, already in the
# lockfile through other crates, so this adds no new crate.
sha2 = "=0.10.9"

# The backup file (ADR 0006 build notes, step 1.13a): a zip of JSON lines and media. `zip` is a pure
# Rust build with deflate only (no encryption, no C libraries), so it compiles on wasm and Android.
# `serde_json` writes and reads the JSON lines (without serde's derive): it is already in the
# lockfile for fc-api and fc-wasm.
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }
serde_json = "=1.0.151"
# `zip` leaves flate2's backend to us. `rust_backend` is miniz_oxide, in pure Rust.
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }

# getrandom needs its browser backend on wasm (ADR 0003, ADR 0004; fsrs needs it too).
[target.'cfg(target_arch = "wasm32")'.dependencies.getrandom]
version = "=0.4.3"
features = ["wasm_js"]
