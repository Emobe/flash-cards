[package]
name = "fc-core"
version = "0.0.0"
description = "Core library: domain logic shared by every app and the sync server."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# Temporary: the spike store (step 0.4). The real schema arrives in step 0.7.
# `bundled` compiles SQLite from C on native targets. On wasm32 rusqlite uses sqlite-wasm-rs.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rusqlite = "=0.40.2"

# FSRS scheduler and optimiser (ADR 0004). Pure Rust. Exact version, as for other key crates.
[dependencies]
fsrs = "=6.6.2"

# fsrs uses rand 0.10, which needs getrandom's browser backend on wasm (ADR 0003, ADR 0004).
[target.'cfg(target_arch = "wasm32")'.dependencies.getrandom]
version = "=0.4.3"
features = ["wasm_js"]
