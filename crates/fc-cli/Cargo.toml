[package]
name = "fc-cli"
version.workspace = true
description = "Developer CLI: drives the core from a terminal for manual testing and debugging."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "fc"
path = "src/main.rs"

[dependencies]
fc-core = { path = "../fc-core" }
# The local UTC offset, which std cannot give (the `Clock` needs it). Already in the lockfile
# through Tauri. Native only: the core itself never reads the clock.
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
