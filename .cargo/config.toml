[alias]
xtask = "run --quiet --package xtask --"

# Android 15+ requires native libraries aligned to 16 KB pages; NDK 27 links
# with 4 KB alignment by default, which triggers a compatibility warning on
# the phone. https://developer.android.com/guide/practices/page-sizes
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
