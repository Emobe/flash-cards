[package]
name = "fc-native"
version.workspace = true
description = "Tauri host for the desktop and mobile apps (Linux, Windows, Android)."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# `_lib` suffix avoids a name clash with the binary on Windows.
name = "fc_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# A copy of `[workspace.lints]` (Cargo cannot override one lint of a workspace table) with
# `unsafe_code` at `deny`, for the one `#[allow(unsafe_code)]` in `main.rs` (ADR 0012, decision 4).
# Keep the rest in step with the root Cargo.toml.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
fc-api = { path = "../../../crates/fc-api" }
base64 = "0.22"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
getrandom = "0.3"
serde_json = "1"
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# Tauri's mock runtime, to check that `set_system_theme` rejects a missing token.
tauri = { version = "2", features = ["test"] }
