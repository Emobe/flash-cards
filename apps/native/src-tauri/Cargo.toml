[package]
name = "fc-native"
version.workspace = true
description = "Tauri host for the desktop and mobile apps (Linux, Windows, Android)."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# `_lib` suffix avoids a name clash with the binary on Windows.
name = "fc_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
fc-api = { path = "../../../crates/fc-api" }
base64 = "0.22"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
getrandom = "0.3"
serde_json = "1"
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# Tauri's mock runtime, to check that `set_system_theme` rejects a missing token.
tauri = { version = "2", features = ["test"] }
