[package]
name = "fc-native"
version = "0.0.0"
description = "Tauri host for the desktop and mobile apps (Linux, Windows, Android)."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# `_lib` suffix avoids a name clash with the binary on Windows.
name = "fc_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
fc-api = { path = "../../../crates/fc-api" }
serde_json = "1"
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
